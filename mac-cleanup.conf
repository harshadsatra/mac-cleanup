# ─────────────────────────────────────────────────────────────
#  mac-cleanup configuration
#  Location: ~/.config/mac-cleanup/mac-cleanup.conf
#  Set a task to true/false to turn it on or off.
#  Run `mac-cleanup.sh --list` to see every task and its status.
# ─────────────────────────────────────────────────────────────

# ── General behaviour ────────────────────────────────────────
DRY_RUN=false            # true = only show what would be deleted
QUIT_APPS=ask            # ask | yes | no  — quit running apps before cleaning them
                         # (scheduled runs never quit apps; they skip that task)
LOG_FILE="$HOME/Library/Logs/mac-cleanup.log"
NOTIFY=true              # macOS notification when a run finishes
SCHEDULE_WEEKDAY=0       # --schedule: 0=Sunday … 6=Saturday
SCHEDULE_HOUR=11         #   rerun --schedule after changing these
SCHEDULE_MINUTE=0

# ── Browsers ─────────────────────────────────────────────────
ENABLE_CHROME_CACHE=true         # Cache, Code Cache, GPU/shader caches in every profile
ENABLE_CHROME_WEBSTORAGE=false   # Site data (IndexedDB/offline). May log you out of web apps!
ENABLE_CHROME_AI_MODEL=true      # Remove Gemini Nano weights.bin + keep it disabled
CHROME_PROFILES_ONLY=""          # e.g. "Default,Profile 6" — empty = all profiles

# ── Apps ─────────────────────────────────────────────────────
ENABLE_CLAUDE_CACHE=true         # Claude desktop caches (never touches vm_bundles)
ENABLE_EDITOR_CACHE=true         # VS Code + Cursor caches (keeps settings/extensions)
ENABLE_ZOOM_CACHE=false          # Zoom cache folders (keeps recordings)
ENABLE_WHATSAPP_MEDIA=false      # Deletes downloaded WhatsApp media on this Mac
WHATSAPP_MEDIA_MAX_AGE_DAYS=30   # only media older than this many days

# ── Developer tooling ────────────────────────────────────────
ENABLE_XCODE=true                # DerivedData, simulator caches, unavailable simulators
ENABLE_ANDROID=true              # Old NDK versions + Gradle caches
ANDROID_NDK_KEEP=1               # keep the newest N NDK versions
ANDROID_NDK_PIN=""               # always keep these, e.g. "26.1.10909125,25.1.8937393"
ANDROID_CLEAN_GRADLE=true        # rm ~/.gradle/caches (re-downloads on next build)

ENABLE_PACKAGE_CACHES=true       # pnpm/npm/yarn/pip/conda/Homebrew caches
ENABLE_DOCKER_PRUNE=false        # docker system prune -a (removes unused images!)
DOCKER_PRUNE_VOLUMES=false       #   …also remove unused volumes (data loss risk)

# ── System ───────────────────────────────────────────────────
ENABLE_USER_LOGS=true            # ~/Library/Logs files older than LOG_MAX_AGE_DAYS
LOG_MAX_AGE_DAYS=30

# ── Your own paths ───────────────────────────────────────────
# Anything listed here is deleted every run. Must be inside your home folder.
ENABLE_EXTRA_PATHS=false
EXTRA_PATHS=(
  # "$HOME/Library/Caches/SomeApp"
  # "$HOME/Downloads/tmp"
)

# ── Tool locations (only needed if a scheduled run can't find them) ──
EXTRA_PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/Library/pnpm"
CONDA_BIN=""                     # e.g. "/opt/homebrew/anaconda3/bin/conda"
